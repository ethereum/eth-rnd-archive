name: Sync Discord archive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted-ghr, size-s-x64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 .github/scripts/sync.py
      - name: Commit and push
        if: always()
        run: |
          git config user.name "eth-rnd-archive"
          git config user.email "eth-rnd-archive@users.noreply.github.com"
          git lfs install --local --skip-smudge
          git add -- .github/sync-state.json
          git ls-files --modified -z -- '*.json' | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          git diff --cached --quiet -- . ':!.github/sync-state.json' && exit 0
          git commit -m "Archive messages up to $(date -u +%F)"
          git push

  next:
    name: Dispatch next run
    runs-on: [self-hosted-ghr, size-s-x64]
    needs: sync
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    timeout-minutes: 90
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      INTERVAL: 3600
    steps:
      - name: Wait for next interval
        run: |
          STARTED=$(gh api "repos/${GH_REPO}/actions/runs/${{ github.run_id }}" --jq '.run_started_at | fromdateiso8601')
          ELAPSED=$(( $(date +%s) - STARTED ))
          REMAINING=$(( INTERVAL + RANDOM % 600 - ELAPSED ))
          if [ "$REMAINING" -gt 0 ]; then
            echo "Sleeping ${REMAINING}s"
            sleep "$REMAINING"
          fi
      - name: Dispatch
        run: |
          for attempt in 1 2 3 4 5; do
            gh workflow run sync.yml --ref master && exit 0
            sleep $((attempt * 15))
          done
          exit 1
